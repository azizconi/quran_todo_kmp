#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dorg.fusesource.jansi.disable=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

kotlin.native.disableCompilerDaemon = true

# Kotlin/Native compiler caches fail on navigation-common (AssertionError in the cache builder) when linking the framework.
kotlin.native.cacheKind=none
